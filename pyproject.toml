[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecomm-prod-assistant"
version = "0.1.0"
dependencies = [
    "fastapi>=0.128.0"
]

[tool.setuptools.packages.find]
include = ["prod_assistant*"]
exclude = ["config*", "static*", "templates*", "notebook*"]
