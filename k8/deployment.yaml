apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-assistant
  labels:
    app: product-assistant
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-assistant
  template:
    metadata:
      labels:
        app: product-assistant
    spec:
      serviceAccountName: product-assistant-sa

      containers:
      - name: product-assistant
        image: 619071324395.dkr.ecr.us-east-2.amazonaws.com/product-assistant:latest
        imagePullPolicy: Always

        ports:
        - containerPort: 8000

        env:
        # ---------------- Runtime ----------------
        - name: RUNTIME_ENV
          value: "aws"
        - name: EXECUTION_ENV
          value: "container"

        # ---------------- HuggingFace cache ----------------
        - name: HF_HOME
          value: "/app/.cache/huggingface"

        # ---------------- LLM Providers ----------------
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: product-assistant-secrets
              key: OPENAI_API_KEY

        - name: GOOGLE_API_KEY
          valueFrom:
            secretKeyRef:
              name: product-assistant-secrets
              key: GOOGLE_API_KEY

        - name: GROQ_API_KEY
          valueFrom:
            secretKeyRef:
              name: product-assistant-secrets
              key: GROQ_API_KEY

        # ---------------- Astra DB ----------------
        - name: ASTRA_DB_API_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: product-assistant-secrets
              key: ASTRA_DB_API_ENDPOINT

        - name: ASTRA_DB_APPLICATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: product-assistant-secrets
              key: ASTRA_DB_APPLICATION_TOKEN

        - name: ASTRA_DB_KEYSPACE
          valueFrom:
            secretKeyRef:
              name: product-assistant-secrets
              key: ASTRA_DB_KEYSPACE

        # ---------------- Health Checks ----------------
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20

        # ---------------- Resources ----------------
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
